[default]
# Ignore hotkey mockup notation like [e]rror, [s]earch in keyboard-shortcut examples.
extend-ignore-re = ["\\[[a-z]\\][a-zA-Z]+"]

[default.extend-words]
beatrax = "beatrax"
Beatrax = "Beatrax"
