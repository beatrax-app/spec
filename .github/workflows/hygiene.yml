# Reusable hygiene checks: workflow lint, spelling, links, markdown.
# Called by each repo:  uses: beatrax-app/spec/.github/workflows/hygiene.yml@v1
# One definition, no drift (Q-R20).
name: hygiene

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      # The org's two pinning rules are the kind that decay silently: nothing
      # fails when a `uses:` line drifts, it just quietly widens the blast
      # radius of someone else's repository. This is the only thing enforcing
      # them, so it runs everywhere hygiene runs.
      - name: action pins (ADR-0012, ADR-0021)
        run: |
          fail=0
          while IFS= read -r line; do
            file=${line%%:*}
            rest=${line#*:}
            lineno=${rest%%:*}
            ref=$(printf '%s' "$line" | sed -E 's/.*uses:[[:space:]]*//; s/[[:space:]]*(#.*)?$//' | tr -d "\"'")

            # A local composite action carries no supply-chain risk of its own.
            case $ref in
              ./*|'') continue ;;
            esac

            if [ "${ref%%/*}" = "beatrax-app" ]; then
              # First-party: the moving major-version tag is the contract.
              if ! printf '%s' "$ref" | grep -qE '@v[0-9]+$'; then
                echo "$file:$lineno: first-party reusable workflow must ride a major-version tag (@v1), got: $ref"
                fail=1
              fi
              continue
            fi

            if ! printf '%s' "$ref" | grep -qE '@[0-9a-f]{40}$'; then
              echo "$file:$lineno: third-party action must be pinned to a full 40-character commit SHA, got: $ref"
              fail=1
            fi
          done < <(grep -rnE '^[[:space:]]*(-[[:space:]]*)?uses:' .github/workflows/ 2>/dev/null)

          if [ "$fail" -ne 0 ]; then
            echo
            echo "See ADR-0012 (third-party SHA pinning) and ADR-0021 (first-party @vN tags)."
            exit 1
          fi
          echo "action pins OK"

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: typos
        uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: lychee link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # A slow third-party host failed this check on a green branch —
          # four timeouts against contributor-covenant.org, zero errors. The
          # retries and the wider timeout cover a host having a bad minute;
          # a link that is genuinely gone still fails, which is the point.
          args: "--no-progress --accept 200,206,429 --timeout 30 --max-retries 5 --retry-wait-time 3 ."
          fail: true

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24.1.0
        with:
          globs: "**/*.md"
