# v2.0 — the promotion of the former v1.4 development line.
#
# Two things force a major rather than a minor (see 00-overview/roadmap.md and
# ADR-0017): category-linked savings pots are retired in favour of envelope
# budgeting, which changes what a user's data means and requires them to
# re-assign released balances by hand; and the product gained a multi-device,
# end-to-end-encrypted, peer-to-peer sync stack with its own identity,
# transport, and at-rest-encryption layers.
#
# Most of these goals are satisfied by work that has landed on the development
# line and has not yet appeared in a tagged release. The latest released tag is
# v1.3.0 (2026-06-14). See the roadmap's three buckets.
#
# AUDITED 2026-09-05 — all 339 identifiers, one at a time, against
# beatrax@origin/main rather than against the headings below. 297 satisfied,
# 36 not, 2 asserted but unproven, 4 outside what either repository can decide.
#
# The audit was opened because one entry was found false by accident. D3-R16
# sat under "(landed)" from this file's founding commit until 2026-09-05, while
# nothing whatsoever told an upgrading reader that money they had set aside was
# now unallocated: no release note, no commit footer a generated body could
# render, no in-app disclosure. The roadmap said so plainly the whole time, one
# file away. A heading nothing reads is a claim nothing checks, so every
# heading in this file was checked, and scripts/manifest_check.py now reads
# them on every push.
#
# The unmet goals stay listed. A goal is a commitment, not a report: `staged`
# is the status that carries unmet goals and `releasable` is the one that does
# not (OPS-R16). No goal was added or removed here — only the claims about them.
#
# NOT SATISFIED, under headings that said landed:
#   E1-R5      the distinction is structural and correct; the test the
#              requirement explicitly demands for it does not exist.
#   E1-R6      OpLogRebuilder works and is well tested; nothing in production
#              calls it, so rebuild is a property rather than the supported
#              operation the requirement names.
#   E1-R11     delete-wins is not configurable. deleteWins() has no caller but a
#              unit test, and a peer tombstone deletes an account whose own rule
#              declares it must not.
#   E1-R15     the per-entry user-scope guard was deliberately removed; peer
#              membership is proved by the confirmed device key instead. The
#              product is right here and the requirement is stale.
#   E2-R6      the typed fallback carries the token alone, not the QR's payload.
#              It re-fetches the identity over the LAN, drops the relay
#              bootstrap, and a phone mints no typed code at all.
#   E2-R10     device_registry.last_seen_at is written on every exchange and
#              read by nothing. The list shows a name and a fingerprint only.
#   E3-R3      the Noise vectors are self-generated determinism anchors. The
#              fixture says so; two test names still call them official.
#   E3-R6      rung two of the ladder — a manually entered host and port —
#              exists nowhere: no field, no config key, no flag.
#   E3-R12     the desktop provisions a relay for itself on boot, on enable and
#              on unlock, then hands the endpoint to the phone over the pairing
#              QR. Neither device chose it, and it is not off by default.
#   E4-R23     the requirement documents an absence that has gone: custody is
#              wired on both shells. The real gap is a Linux desktop with no
#              keyring, which no page mentions.
#   E4-R24     the same shape. The backup-exclusion bridge exists and Android is
#              closed; see E5-R23 for what is actually still open.
#   E5-R10     the async cold-start recovery signal has no emitter. The Android
#              half is a documented skeleton, and Android is the only platform
#              that needs it.
#   E5-R19     the relay is drained first and unconditionally, deliberately, so
#              an epoch wrap is never left unread in a mailbox.
#              LAN-first-then-relay is not what ships.
#   E5-R23     Android is closed. On iOS the exclusion is set inside
#              getAppSupportDir, i.e. on Library/Application Support, while the
#              store is Documents/persisted_data — the ledger, the keyring and
#              the sync identity sit one directory above the flag.
#   A8-R24     the abandoned-run sweeper is correct, owner-scoped and tested,
#              and nothing in production invokes it.
#   B8-R9      two writers reach a reconciled row without refusing and are on no
#              exemption list: goal attribution, and the migration importer's
#              raw status update.
#   B8-R13     three independent writers of transactions.status, none
#              delegating to another, and nothing pinning a single one.
#   C7-R13     the union-and-sort holds for grouped dimensions; a time series
#              and net worth compare by position instead, deliberately, because
#              unioning two disjoint windows invented rows.
#   C1-R8      PositionSummaryDto has no net-worth member at all, and
#              shortfallAhead is a bool, so "not yet computed" is reported as
#              "no shortfall".
#   C8-R1      the requirement was tightened to demand the table list every
#              trigger kind. The product has eleven; the table has eight.
#   C8-R10     the product deliberately reversed this. A write on an unpaired
#              device now persists under a reserved id, because the no-op left
#              the whole settings screen inert on the default install path.
#   C8-R17     no site logs and refuses. The runtime path that meets an
#              unrecognised kind logs it and renders it with a neutral chip.
#
# Four of those — E1-R15, E5-R19, C7-R13 and C8-R10 — are not gaps in the
# product. They are places the product moved on and the requirement did not,
# each with the reasoning recorded in the product repository. Each needs a
# ruling on the requirement, not a fix in the code.
#
# UNPROVEN — a verification this file asserted, and neither repository records:
#   E5-R24     mobile local-notification delivery. The only on-device record in
#              the product is the opposite: a Galaxy producing the inbox row and
#              no OS banner, in a commit whose own body says it does not fix
#              delivery. Nothing has touched the listener since.
#   E5-R25     two-device pairing acceptance. No commit body, no runbook note,
#              no artefact carries the run, and the baseline it names is well
#              behind the tip, over commits that changed the pairing path. A
#              specification asserting its own verification is not evidence.
#
# E5 records all three as taken on an iPhone 12 mini, and this file does not
# overrule that. What it records is narrower and checkable: neither repository
# carries an artefact of either run, so nothing here can be audited against a
# build. For E5-R23 the audit also found something no page yet carries — the
# iOS half flags the wrong directory tree — which is a product defect rather
# than a disagreement about a verification.
#
# OUTSTANDING — scoped work, not yet on the development line:
#   A6-R20, A6-R21          — per-connection credential storage and per-user
#                             credential keying. Carried as accepted deferrals
#                             until 2026-09-05, when the deferral was reversed.
#                             Both are built in an open product pull request and
#                             land together; there is no half-satisfied state.
#   F8-R1 .. F8-R28         — app-store distribution, scoped in F8 and a goal of
#                             this release. Scope is ALL FOUR stores, with
#                             direct download retained wherever it remains
#                             possible (ADR-0032, 2026-09-05). Audited: 12
#                             satisfied, 12 not, and 4 that neither repository
#                             can decide — F8-R4, F8-R15, F8-R16 and F8-R26 are
#                             console records and listing copy, settled in App
#                             Store Connect, the Play Console and Partner
#                             Centre. No store-shaped artefact is built for any
#                             platform yet, which is what F8-R5 and F8-R27 turn
#                             on. F8-R28 remains the largest unknown in the
#                             release: a Mac App Store build needs a runtime
#                             strategy before it needs a submission, because the
#                             sandbox ignores one of the two hardened-runtime
#                             relaxations the bundle uses to map its static
#                             interpreter, and no sandboxed build exists to
#                             measure.
#
# SATISFIED, where a page still says otherwise. Recorded rather than corrected:
# each is a factual call about a feature and belongs to whoever holds it.
#   E2-R18 .. E2-R21        — relayed device identity (ADR-0027) merged on
#                             2026-09-05, the day it was classified into this
#                             release, with the withheld-count filter beside it.
#                             E2 still marks all four *(Open)*, and the roadmap
#                             still says they are being built.
#   F3-R33                  — operating-system key custody is bound on both
#                             shells and the session holds a handle rather than
#                             a key. F3 still marks it *(Open)* and calls the
#                             adapters unwired.
#
# DEFINED, LANDED, IN NO BUCKET — a ruling is needed on each, not a correction.
# Requirements the specification defines and the product satisfies, added to
# their feature pages after this file's blocks were written, and listed in
# neither these goals nor either roadmap bucket. This is the defect the roadmap
# already records for E2-R18..E2-R21, still live for eleven more:
#   A8-R26, C1-R18, C8-R22, D1-R29, D1-R30, E1-R23, E1-R24, E3-R21, E3-R22,
#   E3-R23, E5-R26
# Two more sit in the same gap unsatisfied, so they need the ruling first:
#   B8-R16                  — no exemption list exists in the product at all.
#   C7-R21                  — the read path defaults an unreadable granularity
#                             where the requirement says reject. Deliberate: a
#                             saved report is a synced column and can arrive
#                             from a peer on another build.
# And four requirements marked *(Open)* are in no bucket either, so nothing
# schedules them and nothing has declined them: A8-R27 (satisfied since
# 2026-09-05, the marker is stale), F6-R5, F7-R10 and G7-R11. F6-R5 was marked
# open on 2026-09-05 and was in no bucket within the hour; the check below
# caught it on its first run, which is the case for having the check.
#
# F1-R18 (lock on window close, unverified) remains the one carry-over
# release-readiness item that is NOT a goal of v2.0. It cannot be verified
# outside a real bundle build, and it stays recorded as unsatisfied in F1.

