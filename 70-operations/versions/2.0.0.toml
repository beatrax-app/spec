# v2.0 — the promotion of the former v1.4 development line.
#
# Two things force a major rather than a minor (see 00-overview/roadmap.md and
# ADR-0017): category-linked savings pots are retired in favour of envelope
# budgeting, which changes what a user's data means and requires them to
# re-assign released balances by hand; and the product gained a multi-device,
# end-to-end-encrypted, peer-to-peer sync stack with its own identity,
# transport, and at-rest-encryption layers.
#
# The bulk of these goals are already SATISFIED by work that has landed on the
# development line and has not yet appeared in a tagged release. The latest
# released tag is v1.3.0 (2026-06-14). See the roadmap's three buckets.
#
# OUTSTANDING at the time of writing:
#   E5-R23, E5-R24, E5-R25  — the mobile peer's real-device acceptance and the
#                             backup-exclusion bridge
#   F8-R1 .. F8-R26         — app-store distribution, scoped in F8 and a goal of
#                             this release. Several are already satisfied by
#                             shipped work; the rest are the outstanding block.
#                             Scope is the two mobile stores: the Mac App Store
#                             and the Microsoft Store are out, and F8 says why,
#                             which closes that part of the roadmap's open
#                             question.
#
# Carry-over release-readiness items (A6-R20, A6-R21, F1-R18, F3-R33) are
# recorded as unsatisfied in their own feature docs. They are deliberately NOT
# goals of v2.0: v2.0 ships single-user with one bank connection, under which
# each is a documented limitation rather than a defect.

