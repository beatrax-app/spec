# v2.0 — the promotion of the former v1.4 development line.
#
# Two things force a major rather than a minor (see 00-overview/roadmap.md and
# ADR-0017): category-linked savings pots are retired in favour of envelope
# budgeting, which changes what a user's data means and requires them to
# re-assign released balances by hand; and the product gained a multi-device,
# end-to-end-encrypted, peer-to-peer sync stack with its own identity,
# transport, and at-rest-encryption layers.
#
# Most of these goals are satisfied by work that has landed on the development
# line and has not yet appeared in a tagged release. The latest released tag is
# v1.3.0 (2026-06-14). See the roadmap's three buckets.
#
# AUDITED 2026-09-05 — all 339 identifiers, one at a time, against
# beatrax@origin/main rather than against the headings below. 297 satisfied,
# 36 not, 2 asserted but unproven, 4 outside what either repository can decide.
#
# The audit was opened because one entry was found false by accident. D3-R16
# sat under "(landed)" from this file's founding commit until 2026-09-05, while
# nothing whatsoever told an upgrading reader that money they had set aside was
# now unallocated: no release note, no commit footer a generated body could
# render, no in-app disclosure. The roadmap said so plainly the whole time, one
# file away. A heading nothing reads is a claim nothing checks, so every
# heading in this file was checked, and scripts/manifest_check.py now reads
# them on every push.
#
# The unmet goals stay listed. A goal is a commitment, not a report: `staged`
# is the status that carries unmet goals and `releasable` is the one that does
# not (OPS-R16). No goal was added or removed here — only the claims about them.
#
# NOT SATISFIED — or, for two of them, withdrawn. What the re-audit below left standing:
#   E4-R23     WITHDRAWN 2026-09-05. The requirement documented an absence that
#              has gone: custody is wired on both shells. The residual it leaves
#              — a platform store that answers and does not protect, which is a
#              keyring-less Linux desktop — moved to F3, which now reports
#              unprotected for any store it cannot positively identify, and E4
#              says so. That successor is satisfied and is a goal below; naming
#              it inside this list is what made the manifest gate read it as
#              unmet, so it is named outside the list instead.
#   E4-R24     WITHDRAWN 2026-09-05, the same shape and the same day. The
#              backup-exclusion bridge exists and the mobile build applies it,
#              so there is no absence left to document. What the requirement was
#              for has a successor on E4, named there and not here for the
#              reason above: a name in this list is read as a claim that the id
#              is unmet. The iOS residual this entry used to point at closed in
#              the re-audit below.
#   E5-R10     the async cold-start recovery signal has no emitter. The Android
#              half is a documented skeleton, and Android is the only platform
#              that needs it.
#
# The sixteen this list used to carry are closed, each with its own entry under
# RE-AUDITED and RULED below. They are named there and not here, because a name
# in this list is a claim, and the group headings in `goals` are checked against it.
#
# RE-AUDITED 2026-09-06 — the list above, one identifier at a time, against
# beatrax@origin/main rather than against itself. Eleven of the twenty-two have
# closed since it was written, seven of them before this session touched
# anything: an audit is a photograph, and a list of unmet goals goes stale in
# the direction of being wrong about the product.
#
#   E3-R3      closed. No test name calls the Noise vectors official; the
#              wording the entry describes is not in the tree.
#   A8-R24     closed. `migration:sweep-abandoned` is scheduled in
#              routes/console.php, so production invokes it.
#   B8-R9      closed. `ReconciledRowExemptions` exists with a guard reading
#              the tree back against it, which is what the entry asked for.
#   B8-R13     closed. `ReconciliationWriter` and `PromoteStagingToDomain` both
#              inject `TransactionStatusWriter`; the column has one owner.
#   C1-R8      closed. `PositionSummaryDto` carries a `NetWorth`, and
#              `ShortfallRisk` is a three-case enum whose own comment records
#              that collapsing it to a boolean reported an unforecast month as
#              a safe one.
#   C8-R17     closed, and the entry read the wrong path. The WRITE path
#              refuses by type — `NotificationDraft::$triggerType` is the enum,
#              so an unrecognised kind cannot be persisted at all, which is a
#              stronger refusal than a runtime check. The READ path logs the
#              kind and renders a neutral chip, which is what a row written by
#              a peer on a newer build should get: refusing there would hide a
#              real notification rather than refuse a bad one.
#   E5-R23     closed 2026-09-06 by a re-check naming the path, recorded on E5.
#
#   E1-R11     closed by beatrax#446. `_delete_wins` decides the exact HLC tie
#              and the merge never asked: `tombstoneWins()` returned `>= 0` for
#              every table, so `accounts` — which sets it false — lost a row to
#              a peer's delete made at the same instant. A guard now holds every
#              registry directive to a reader in the shipping tree.
#   E1-R5      closed by beatrax#447. The distinction was right and had no case;
#              three now hold it, including one asserting the two entries differ
#              in nothing but their operation kind.
#   E1-R6      closed by beatrax#447. `sync:rebuild` makes the rebuild an
#              operation rather than a property the code happened to have.
#   E2-R10     closed by beatrax#447. `last_seen_at` was written on every
#              exchange and read by nothing; the device list shows it.
#
# Eight remained. Four needed a ruling rather than a fix and are ruled below;
# four were code: E2-R6, E3-R6, E3-R12 and E5-R10. Three of those are closed
# under CLOSED below, including E3-R12, whose open half — whether anything
# provisions a relay unasked — this re-audit could not establish and the next
# pass did.
#
# ONE REMAINS, and it is the one nothing in this session could honestly take:
#   E5-R10     needs an Android device. The PHP half is complete and reachable
#              — recover() answers pendingAsync, completePendingRecover() polls,
#              pollRecovered() reads the blob back — and the Kotlin half says of
#              itself that it is a skeleton needing an Activity and the event
#              API. A BiometricPrompt cannot be verified without hardware that
#              has a fingerprint enrolled, and writing the emitter blind would
#              produce a change that looks like a fix and is not one. No Android
#              device was attached; only an iPhone was.
#
# C8-R1 was the one entry that was a defect in THIS repository rather than in
# the product: the C8 table listed eight trigger kinds while the enum has
# eleven, which is exactly what that requirement asks the table not to do. The
# table is corrected in the same change as this note.
#
# Four of those — E1-R15, E5-R19, C7-R13 and C8-R10 — were not gaps in the
# product. They were places the product moved on and the requirement did not,
# each with the reasoning recorded in the product repository, and each needed a
# ruling on the requirement rather than a fix in the code.
#
# RULED 2026-09-06. Two went to the code and two to the requirement. The two
# that went to the code are worth reading together: a requirement a product has
# drifted from is not evidence the requirement is stale, and restoring the first
# of these found a live defect that four months of the drifted design had hidden.
#
#   E1-R15     RULED: restore the guard — and it was not a wording gap. The
#              confirmed key map is read once, for one user, at construction;
#              the scope to write into arrives per replay() call, and nothing
#              held the two together. An entry admitted against another user's
#              key set was then re-stamped onto the replay scope and persisted
#              under it, so a device only one household member had confirmed
#              could write the other's ledger. Proven by removing the restored
#              guard: the other user's transaction changed category, and the
#              ordering case reported unknown_table instead of cross_user. Two
#              comments already described the gate as though it were there.
#              The removal's own reasoning still holds and is kept: a wire
#              user_id is the SENDING device's autoincrement, so what is
#              compared is which user the key set was read for, never the
#              entry's own claim. Closed by beatrax#448.
#   E5-R19     RULED: change the code. The LAN leg now runs before the relay,
#              which is also the cheaper order — the relay carries no operations
#              at all, only epoch wraps, and the LAN leg already hands over the
#              keys ahead of the entries they decrypt. The drain stays
#              unconditional on purpose: the requirement fixes the ORDER of the
#              legs, not whether the mailbox is read, and skipping it on a
#              working LAN is what once left a wrap from a non-LAN peer unread.
#              Both mobile pages already claimed "LAN-first, relay fallback".
#              Closed by beatrax#448.
#   C7-R13     RULED: scope the requirement, done in this change. Union-and-sort
#              applies where a group key names something that outlives a period;
#              a date-keyed series — a time bucket, and net worth — matches on
#              position, because two disjoint windows share no date key and
#              unioning them invents rows neither period held. The rule now also
#              states what a missing counterpart means in each: zero in a
#              grouped comparison, unknown in a positional one.
#   C8-R10     RULED: amend the requirement, done in this change. An unpaired
#              device persists a write under a reserved device id that cannot
#              collide with a real one, and pairing carries that row onto the
#              device's own sync identity so a setting chosen before pairing
#              survives it. The no-op the requirement asked for left the whole
#              notification screen accepting input and dropping it, on the
#              install path that never pairs — which is the default one.
#
# CLOSED 2026-09-06, the code half of what the re-audit left standing.
#
#   E3-R6      closed by beatrax#448. The ladder's middle rung — a manually
#              entered host and port — existed nowhere, so a network whose
#              browse never answers left the dial falling through to an address
#              guessed from the relay endpoint's host. `device_registry` now
#              carries manual_lan_host/port, typed as one host:port field on
#              the devices screen, in its OWN columns rather than seeded into
#              last_lan_host: forget() clears where the peer was last REACHED,
#              and a fallback a failed dial erases is not a fallback. Order is
#              discovery, then typed, then the relay-derived guess.
#   E2-R6      closed by beatrax#449, and two halves of the entry were wrong
#              about the product rather than about the requirement.
#              The real gap was that the typed arm's only road to the payload
#              was an mDNS browse, so it could not work on a network that
#              blocks multicast — which on iPhone is every network. It now asks
#              the address the reader gives after the browse comes up empty,
#              and the screen offers that field on the one refusal it answers.
#              The two the entry named as gaps are consequences of other
#              requirements, not gaps: the relay bootstrap is dropped from any
#              FETCHED offer on purpose, because a reply is not the out-of-band
#              channel a scanned QR is and a peer naming a relay is an older
#              build or an attacker — a case has pinned that since before this
#              change, and a second now pins it for the typed address. And a
#              phone mints no code because minting one means serving the offer
#              over LAN, which E5-R2 forbids it.
#   E3-R12     satisfied as it stands; the entry read one fact and missed two.
#              A fresh install configures no relay, and RelayListenerProcess
#              returns before provisioning anything unless the device already
#              has a sync identity — so nothing is on until sync is enabled.
#              What is provisioned then is the device's OWN LAN address and
#              never a remote host, LocalRelayProvisioner refuses to re-point
#              an operator's non-LAN endpoint, and PairingPeerLink refuses to
#              let a scanned QR redirect one either. The address is a file-backed
#              user setting on the devices screen, empty by default, and is a
#              constant nowhere. The entry's "neither device chose it" is true
#              only of a household's own machine advertising itself.
#
# One finding came out of the E5-R19 work rather than out of the audit:
# SealedLedgerRecovery, which retries a recoverable quarantine, is reached only
# from an after-response middleware the repo-root bootstrap registers. The
# mobile shell has its own bootstrap and does not register it, so on the phone a
# gdk_decrypt_failed row was retried during setup and never again — E1-R24 asks
# that a recoverable reason be both retried and retired. Closed by beatrax#448.
#
# UNPROVEN — a verification this file asserted, and neither repository records:
#   E5-R24     mobile local-notification delivery. The only on-device record in
#              the product is the opposite: a Galaxy producing the inbox row and
#              no OS banner, in a commit whose own body says it does not fix
#              delivery. Nothing has touched the listener since.
#   E5-R25     two-device pairing acceptance. No commit body, no runbook note,
#              no artefact carries the run, and the baseline it names is well
#              behind the tip, over commits that changed the pairing path. A
#              specification asserting its own verification is not evidence.
#
# E5 records all three as taken on an iPhone 12 mini, and this file does not
# overrule that. What it records is narrower and checkable: neither repository
# carries an artefact of either run, so nothing here can be audited against a
# build. For E5-R23 the audit also found something no page yet carries — the
# iOS half flags the wrong directory tree — which is a product defect rather
# than a disagreement about a verification.
#
# OUTSTANDING — scoped work, not yet on the development line:
#   F8-R1 .. F8-R28         — app-store distribution, scoped in F8 and a goal of
#                             this release. Scope is ALL FOUR stores, with
#                             direct download retained wherever it remains
#                             possible (ADR-0032, 2026-09-05).
#
#                             RE-AUDITED 2026-09-07, one identifier at a time
#                             against beatrax@origin/main. The "12 satisfied, 12
#                             not" above was written before four of them closed
#                             and while the rest went unread: twenty-two are
#                             satisfied, four are console records, and two are
#                             open. What follows is what each is satisfied BY,
#                             because a count nobody can re-derive is the thing
#                             this file keeps having to correct.
#
#                             Satisfied by the release pipeline reading its own
#                             artifacts: R1 (manifest + checksums, with a signed
#                             record covering every asset on the page), R2 (the
#                             verify-signature action on macOS and Windows,
#                             apksigner on the APK, keytool on the AAB), R3 (one
#                             signing-identity register, compared against the
#                             workflows in both directions), R5 (the AAB is
#                             built beside the APK — beatrax#450), R6 and R7
#                             (`mobile:inspect-bundle` opens the artifact and
#                             reads it, nested archives included — beatrax#450),
#                             R17 (SDK levels are integer literals here, read
#                             back off the shipped artifact), R18 and R19
#                             (`mobile:check-permissions` over the MERGED
#                             manifest, each permission naming the shipped class
#                             that makes its use — beatrax#450).
#
#                             Satisfied in the product: R8 (the dev-console gate
#                             allow-lists development environments by NAME, and
#                             on mobile requires app.debug), R9, R10 and R11
#                             (the iOS privacy manifest and export-compliance
#                             patches, each with cases — including the
#                             ITMS-91056 omit-rather-than-empty rule), R12 and
#                             R13 (purpose strings restated in this product, in
#                             all 26 languages, one tree feeding Info.plist and
#                             every .lproj), R14 (LSApplicationCategoryType),
#                             R20 (a store build reaches no feed it could
#                             install from), R21 (the update surfaces render no
#                             control on a phone, not merely a different
#                             sentence), R22 (no shipped mobile dependency
#                             carries analytics), R23 (the review notes name the
#                             screen and the two presses — beatrax#450), R24
#                             (the sample-data control, on a surface a store
#                             build carries), R25 (deletion takes the identity
#                             and the keyring with it, and says a paired device
#                             keeps its own copy).
#
#                             Four neither repository can decide, unchanged:
#                             R4, R15, R16 and R26 are console records and
#                             listing copy, settled in App Store Connect, the
#                             Play Console and Partner Centre.
#
#                             TWO OPEN.
#
#                             R27 is additive on three of the four now. Play
#                             takes the AAB and the APK stays the direct
#                             download; iOS has no direct-download shape to be
#                             additive with; the Microsoft Store is an EXE/MSI
#                             listing by decision, so the NSIS artifact IS the
#                             store shape. The Mac App Store is the fourth, and
#                             it waits on R28.
#
#                             R28 remains the largest unknown in the release: a
#                             Mac App Store build needs a runtime strategy
#                             before it needs a submission, because the sandbox
#                             ignores one of the two hardened-runtime
#                             relaxations the bundle uses to map its static
#                             interpreter, and no sandboxed build exists to
#                             measure.
#
#                             ONE FINDING, not a requirement of its own but a
#                             Microsoft Store certification prerequisite the
#                             runbook lists and nothing checks: the signature
#                             verification reads the INSTALLER, and store
#                             certification is per-file. Nothing signs the
#                             bundled PHP interpreter or its DLLs — electron-
#                             builder signs the app executable and the installer
#                             via azureSignOptions, and extraResources are not
#                             in that set. Configuring and proving it needs a
#                             Windows runner and the Azure credentials, so it is
#                             recorded rather than written blind.
#
# SATISFIED, and the pages that said otherwise are corrected as of 2026-09-05:
#   E2-R18 .. E2-R21        — relayed device identity (ADR-0027), merged the day
#                             it was classified into this release, with the
#                             withheld-count filter beside it. E2's four markers
#                             and the roadmap's bucket are cleared.
#   F3-R33                  — operating-system key custody is bound on both
#                             shells and the session holds a handle rather than
#                             a key. F3's marker is cleared and its "registered
#                             but not yet wired" prose is gone.
#   A6-R20, A6-R21          — per-connection credential storage and per-user
#                             credential keying, satisfied together because they
#                             are two axes of one file. A6's markers and both
#                             "Known limitation" sections are gone.
#
# DEFINED, LANDED, IN NO BUCKET — RESOLVED 2026-09-06. The thirteen below are
# now goals of this release, in the block named for them. They were defined by
# this release's own work and the product satisfies them; leaving them unlisted
# meant nothing could report on them, which is the defect the roadmap already
# records for E2-R18..E2-R21. Listing a requirement this release defined and
# satisfied is a correction, not a scope decision — the scope decision would be
# adding one it does not satisfy.
#   A8-R26, C1-R18, C8-R22, D1-R29, D1-R30, E1-R23, E1-R24, E3-R21, E3-R22,
#   E3-R23, E5-R26 — the eleven; E2-R22 and F3-R37 joined them on 2026-09-05
# Two more sit in the same gap unsatisfied, so they need the ruling first:
#   B8-R16                  — no exemption list exists in the product at all.
#   C7-R21                  — the read path defaults an unreadable granularity
#                             where the requirement says reject. Deliberate: a
#                             saved report is a synced column and can arrive
#                             from a peer on another build.
# One requirement marked *(Open)* is in no bucket, so nothing schedules it and
# nothing has declined it: F6-R5, which was marked open on 2026-09-05 and was in
# no bucket within the hour — the check below caught it on its first run, which
# is the case for having the check. Three others were on this list and are not
# any more: A8-R27's refusal records the file, the column and the value;
# F7-R10's single export action had shipped, so the marker was cleared where it
# stood rather than scheduled; and G7-R11's two reference tables now resolve
# their seeded `name` through a key, read by every render site rather than
# merely present.
#
# E2-R22 (which authors a device may relay for) and F3-R37 (what custody does
# where the platform store is absent or does not protect) are in that block too.
#
# DEFINED, SCHEDULED, AND SATISFIED SINCE — RESOLVED 2026-09-06. E6-R13 .. E6-R16
# and E5-R27 — the withheld status, where it ranks, one classification behind
# every surface that reports a hold, copy that stays true for a hold nobody can
# act on, and a first sync that does not report a history it is short of — were
# built on 2026-09-05 in beatrax#406 and #407, hours after this note and both
# feature pages were last read. They are goals now, and the markers are cleared.
#
# F1-R18 (lock on window close) was the one carry-over release-readiness item
# that is NOT a goal of v2.0. It is satisfied as of 2026-09-05, and the claim
# that it "cannot be verified outside a real bundle build" was wrong: the suite
# persists the window's session, drives the real shell event POST and reloads
# that session from the handler. F1-R15 took its place as F1's open item — the
# watchdog's rolling counter does not survive the request that writes it — and
# it is in the roadmap's outstanding bucket rather than here.

