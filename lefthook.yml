# Local hooks that mirror CI (Q-R21). Install: `lefthook install`.
pre-commit:
  parallel: true
  commands:
    typos:
      run: typos
    markdownlint:
      glob: "*.md"
      run: markdownlint-cli2 {staged_files}
pre-push:
  commands:
    integrity:
      run: python3 scripts/integrity.py
    manifests:
      run: python3 scripts/manifest_check.py
